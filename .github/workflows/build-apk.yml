name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Clean All Preview Platforms & Install SDK 34
        run: |
          rm -rf $ANDROID_SDK_ROOT/platforms/android-35*
          rm -rf $ANDROID_SDK_ROOT/platforms/android-36*
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.0.10792818" "platforms;android-34" "build-tools;34.0.0"

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall

      - name: Install Qt 6.7.2 Android & Desktop
        run: |
          mkdir -p $HOME/Qt
          python -m aqt install-qt linux android 6.7.2 android_arm64_v8a -O $HOME/Qt -m qtmultimedia
          python -m aqt install-qt linux desktop 6.7.2 linux_gcc_64 -O $HOME/Qt

      - name: Configure CMake
        run: |
          $HOME/Qt/6.7.2/android_arm64_v8a/bin/qt-cmake -S . -B build-ci \
            -DQT_HOST_PATH=$HOME/Qt/6.7.2/gcc_64 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/26.0.10792818 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Force Min SDK 28 & Auto Sign APK
        run: |
          # 1. Ép minSdkVersion về 28 (Android 9) cho vừa khít xe của mày
          sed -i 's/minSdkVersion .*/minSdkVersion 28/g' build-ci/android-build/build.gradle || true
          
          # 2. Tạo debug keystore nếu chưa có
          keytool -genkey -v -keystore $HOME/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      - name: Build APK
        run: |
          cmake --build build-ci --target apk

      - name: Sign APK with apksigner
        run: |
          # Tìm file apk unsigned vùa build xong và ký trực tiếp
          APK_PATH=$(find build-ci/android-build/ -name "*.apk" | head -n 1)
          $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks $HOME/debug.keystore --ks-pass pass:android $APK_PATH

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlayer-Android9-Signed-APK
          path: build-ci/android-build/build/outputs/apk/*/*.apk
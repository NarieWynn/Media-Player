name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install aqtinstall
        run: |
          python -m pip install --upgrade pip
          pip install aqtinstall

      - name: Install Qt 6.7.2 Android & Desktop
        run: |
          mkdir -p $HOME/Qt
          python -m aqt install-qt linux android 6.7.2 android_arm64_v8a -O $HOME/Qt -m qtmultimedia
          python -m aqt install-qt linux desktop 6.7.2 linux_gcc_64 -O $HOME/Qt

      - name: Configure CMake
        run: |
          mkdir build-android && cd build-android
          $HOME/Qt/6.7.2/android_arm64_v8a/bin/qt-cmake .. \
            -DQT_HOST_PATH=$HOME/Qt/6.7.2/gcc_64 \
            -DANDROID_SDK_ROOT=$ANDROID_SDK_ROOT \
            -DANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk-bundle \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-34 \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: |
          cd build-android
          cmake --build . --target apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPlayer-Android-APK
          path: build-android/android-build/build/outputs/apk/*/*.apk